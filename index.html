<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>World Monitor Lite</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Load D3 and TopoJSON for the map -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://unpkg.com/topojson-client@3"></script>
</head>
<body>
  <header>
    <h1>World Monitor <span class="lite">lite</span></h1>
    <span class="asof">Top stories by region · updated every 30 min</span>
  </header>

  <main>
    <!-- Map Section -->
    <section id="map-section">
      <!-- The SVG map will be injected here -->
      <div id="map-container" aria-label="Global story heatmap"></div>
      
      <div class="legend">
        <span>Fewer Stories</span>
        <div class="legend-box" style="opacity: 0.15"></div>
        <div class="legend-box" style="opacity: 0.45"></div>
        <div class="legend-box" style="opacity: 0.75"></div>
        <div class="legend-box" style="opacity: 1.0"></div>
        <span>More Stories</span>
      </div>
    </section>

    <!-- Story Grid Section -->
    <div id="grid">
      <p class="loading">Loading world stories…</p>
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
